<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Super_HandAI_z — агент-исполнитель</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%230c0d10'/%3E%3Cg%20fill='none'%20stroke='%234a9eff'%20stroke-width='5'%20stroke-linecap='round'%20stroke-linejoin='round'%3E%3Cpath%20d='M10%2022%20v20'/%3E%3Cpath%20d='M10%2024%20h12%20a5%205%200%200%201%205%205%20v3'/%3E%3Cpath%20d='M10%2040%20h12%20a5%205%200%200%200%205%20-5%20v-3'/%3E%3Cpath%20d='M54%2022%20v20'/%3E%3Cpath%20d='M54%2024%20h-12%20a5%205%200%200%200%20-5%205%20v3'/%3E%3Cpath%20d='M54%2040%20h-12%20a5%205%200%200%201%20-5%20-5%20v-3'/%3E%3C/g%3E%3Ccircle%20cx='32'%20cy='32'%20r='4.5'%20fill='%23ffd166'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="vendor/xterm.css?t=TOKEN" />
    <link rel="stylesheet" href="style.css?t=TOKEN&v=7" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">Super_HandAI_z</div>
      <div class="status" id="status">— нет задачи —</div>
      <div id="submodeBar" class="submode-bar" title="Подрежимы фич — переключаются в один клик, без рестарта агента"></div>
    </header>
    <main class="layout">
      <section class="left">
        <div class="panel">
          <h2>ТЗ</h2>
          <textarea
            id="tzText"
            placeholder="Вставьте сюда ТЗ из чата (с обёрткой или без)"
            spellcheck="false"
          ></textarea>
          <div class="btnrow">
            <button id="btnRun" class="primary">▶ Запустить</button>
            <button id="btnStop" class="warn">Стоп</button>
            <button id="btnPaste" title="Заменить содержимое поля буфером обмена">⧉ Вставить из буфера</button>
          </div>
        </div>
        <div class="panel steps-panel">
          <h2>Шаги</h2>
          <ol id="steps" class="steps"></ol>
        </div>
        <div class="panel">
          <h2>Отчёт</h2>
          <textarea id="report" readonly spellcheck="false"></textarea>
          <div class="btnrow">
            <button id="btnCopy">⧉ Копировать отчёт</button>
          </div>
        </div>
        <details class="panel features-panel">
          <summary><h2>Фичи</h2></summary>
          <div class="features-security">⚠ Фичи исполняются с правами агента — не ставьте код из недоверенных источников.</div>
          <table class="features-table">
            <thead>
              <tr><th>Имя</th><th>Описание</th><th>Версия</th><th>Вкл</th><th></th></tr>
            </thead>
            <tbody id="featuresBody">
              <tr><td colspan="5">загрузка…</td></tr>
            </tbody>
          </table>
          <div class="btnrow">
            <button id="btnFeatureUpload">⬆ Загрузить фичу</button>
            <input type="file" id="featureFile" accept=".feature.js,.js" style="display:none" />
            <button id="btnFeaturesReload">⟳ Обновить</button>
          </div>
          <div id="featuresMsg" class="features-msg"></div>
        </details>
        <div id="confirm" class="confirm hidden">
          <p id="confirmText"></p>
          <div class="btnrow">
            <button id="confirmOk" class="primary">Ок</button>
            <button id="confirmCancel" class="warn">Отмена</button>
          </div>
        </div>
      </section>
      <section class="right">
        <div class="panel term-panel">
          <h2>Терминал</h2>
          <div id="term"></div>
        </div>
      </section>
    </main>
    <script src="vendor/xterm.js?t=TOKEN"></script>
    <script src="app.js?t=TOKEN"></script>
    <script src="features.js?t=TOKEN"></script>
  </body>
</html>
